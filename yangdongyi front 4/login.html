<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>양동이 챗봇 로그인</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{margin:0;font-family:'Noto Sans KR',sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background:#f0f2f5}
    .container{display:flex;width:1500px;height:700px;background:#fff;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.1);overflow:hidden;position:relative}
    .logo-top{position:absolute;top:20px;right:20px;width:270px}
    .left{flex:.7;background:#1E4DA1;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:left;padding:40px;position:relative}
    .left h1{font-size:50px;margin-bottom:5px;text-align:left}
    .left p{margin:0;font-size:18px}
    .character-center{position:absolute;top:50%;left:48.4%;transform:translate(-50%,-50%);width:1300px;pointer-events:none}
    .right{flex:1;display:flex;justify-content:right;align-items:center;background:#f9f9f9}
    .login-box{margin-left:300px}
    .login-box h2{margin-bottom:10px;text-align:left}
    .login-box input{width:60%;padding:14px;margin-bottom:6px;border:1px solid #ddd;border-radius:10px;height:46px;font-size:14px}
    .login-box button{width:65.5%;padding:14px;border:none;background:#1E4DA1;color:#fff;font-size:14px;border-radius:8px;cursor:pointer;margin-top:6px;height:47px}
    .login-box button:hover{background:#163a78}
    .signup{margin-top:10px;font-size:14px;text-align:left}
    .signup a{color:#1E4DA1;text-decoration:none}
    .error{color:#b10017;font-size:13px;margin-top:6px}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;display:none}
  </style>
</head>
<body>
  <div class="container">
    <img src="image/logo.png" alt="동양미래대학교 로고" class="logo-top" />
    <div class="left">
      <h1>Welcome<br />Back!</h1>
      <p>We’re glad to see you again.</p>
    </div>

    <div class="right">
      <div class="login-box">
        <h2>로그인</h2>
        <input id="login-id" type="text" placeholder="ID (학번/교번)" />
        <input id="login-pw" type="password" placeholder="Password" />
        <div id="login-err" class="error" style="display:none"></div>

        <button id="loginBtn">로그인</button>
        <button id="guestBtn" style="background:#6b7280">비회원 로그인</button>

        <div class="signup">
          계정이 없으신가요? <a href="signup.html">회원가입</a>을 눌러주세요!
        </div>
      </div>
    </div>

    <img src="image/yangdongi.png" alt="양동이 중앙" class="character-center" />
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const API_BASE = "http://127.0.0.1:8001";

    function toast(msg){
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(()=> t.style.display="none", 1500);
    }

    // 로그인
    document.getElementById("loginBtn").addEventListener("click", async () => {
      const id = document.getElementById("login-id").value.trim();
      const password = document.getElementById("login-pw").value;

      const err = document.getElementById("login-err");
      err.style.display = "none";

      if(!id || !password){
        err.textContent = "ID와 비밀번호를 입력해 주세요.";
        err.style.display = "block";
        return;
      }

      try{
        const res = await fetch(`${API_BASE}/api/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",                  // ★ 세션 쿠키 사용
          body: JSON.stringify({ id, password })   // 서버는 id / password 키로 받도록 구현되어 있음
        });
        const data = await res.json();
        if(!res.ok || !data.ok){
          err.textContent = data.msg || "로그인 실패";
          err.style.display = "block";
          return;
        }
        // 로그인 성공 → 메인으로
        toast("로그인 성공! 이동합니다.");
        setTimeout(()=> location.href = "main.html", 500);
      }catch(e){
        err.textContent = "서버와 통신 중 오류가 발생했습니다.";
        err.style.display = "block";
      }
    });

    // 비회원 로그인
    document.getElementById("guestBtn").addEventListener("click", () => {
      // 게스트 모드라면 세션 없이 바로 이동
      localStorage.setItem("isGuest", "true");
      localStorage.removeItem("isLoggedIn");
      location.href = "main.html";
    });
  </script>
</body>
</html>
